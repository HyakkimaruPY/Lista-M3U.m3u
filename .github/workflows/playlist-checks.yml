name: Estrutura e regressões IPTV
on:
  push:
    branches: [main]
    paths: ['*.m3u', 'scripts/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['*.m3u', 'scripts/**', 'tests/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m compileall -q scripts tests
      - run: python -m unittest discover -s tests -v
