name: Renovar CGTN Español

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_cgtn_es_portable.py'
      - 'scripts/probe_cgtn_same_cdn.py'
      - 'scripts/refresh_cgtn_es_tv.py'
      - 'scripts/refresh_cgtn_es_web.py'
      - 'scripts/refresh_cgtn_es.py'
      - '.github/workflows/refresh-cgtn-es.yml'

permissions:
  contents: write

concurrency:
  group: cgtn-es-runtime
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver e normalizar contrato legado do CGTN Español
        run: |
          python3 scripts/refresh_cgtn_es_portable.py \
            --output /tmp/cgtn-es.m3u8 \
            --state /tmp/cgtn-es.json \
            --patch-playlists \
            --timeout 12
          echo '--- runtime state ---'
          cat /tmp/cgtn-es.json
          echo '--- bridge manifest ---'
          sed -E 's/(wsSecret|cKey|vkey|guid|flowid)=[^& ]+/\1=<redacted>/g' /tmp/cgtn-es.m3u8

      - name: Validar áudio real antes da publicação
        run: |
          python3 - <<'PY'
          import json
          s = json.load(open('/tmp/cgtn-es.json', encoding='utf-8'))
          p = s.get('selected', {})
          assert s.get('legacy_audio_ready') is True, s
          assert s.get('audio_delivery') == 'aac-lc-48000-stereo', s
          assert p.get('video_codec') == 'h264', p
          assert p.get('audio_codec') == 'aac', p
          assert str(p.get('audio_profile', '')).upper() == 'LC', p
          assert int(p.get('audio_rate') or 0) == 48000, p
          assert int(p.get('audio_channels') or 0) == 2, p
          print('CGTN legacy contract OK:',
                p.get('width'), 'x', p.get('height'),
                p.get('fps'), 'fps,',
                'H.264 + AAC-LC 48 kHz stereo')
          PY

      - name: Diagnosticar representações no mesmo CDN
        run: |
          python3 scripts/probe_cgtn_same_cdn.py

      - name: Gravar URL estável nas playlists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cn.m3u srhell02iptv.m3u
          if ! git diff --cached --quiet; then
            git commit -m 'Ajusta bridge web da CGTN Español [skip ci]'
            git push origin HEAD:main
          fi

      - name: Publicar bridge em branch runtime
        run: |
          git checkout --orphan cgtn-runtime-build
          git rm -rf .
          cp /tmp/cgtn-es.m3u8 ./cgtn-es.m3u8
          cp /tmp/cgtn-es.json ./cgtn-es.json
          cat > README.md <<'EOF'
          # CGTN Español runtime

          Branch gerada automaticamente para o player legado Philco.
          A saída publicada usa somente a fonte do player web oficial da CGTN
          (espanol.cgtn.com -> espanol-livetx-h5.cgtn.com). URLs Yangshipin/CCTV
          podem ser usadas apenas para diagnóstico, nunca como URL entregue à TV.

          O runtime só é publicado quando o MPEG-TS real passa o contrato legado:
          vídeo H.264 e áudio AAC-LC, 48 kHz, 2 canais. O master inclui resolução,
          frame-rate, codecs e bitrate medidos no fluxo para evitar metadados
          indefinidos no player antigo.
          EOF
          git add cgtn-es.m3u8 cgtn-es.json README.md
          git commit -m "Renova CGTN Español web $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push --force origin HEAD:cgtn-runtime

      - name: Validar bridge web portátil
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          STABLE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/cgtn-runtime/cgtn-es.m3u8"
          curl --fail --location --retry 3 --retry-delay 2 "$STABLE" -o /tmp/public-cgtn.m3u8
          grep -q '^#EXTM3U' /tmp/public-cgtn.m3u8
          grep -q '^#EXT-X-STREAM-INF:' /tmp/public-cgtn.m3u8
          grep -q 'RESOLUTION=' /tmp/public-cgtn.m3u8
          grep -q 'FRAME-RATE=' /tmp/public-cgtn.m3u8
          grep -q 'CODECS=' /tmp/public-cgtn.m3u8
          grep -q 'mp4a.40.2' /tmp/public-cgtn.m3u8
          UPSTREAM="$(grep -E '^https?://' /tmp/public-cgtn.m3u8 | head -1)"
          test -n "$UPSTREAM"
          python3 - "$UPSTREAM" <<'PY'
          import json, sys, urllib.request
          from urllib.parse import urlparse
          url=sys.argv[1]
          s=json.load(open('/tmp/cgtn-es.json'))
          p=s.get('selected',{})
          assert s.get('delivery_policy') == 'portable-web-only', s
          assert s.get('client_portable') is True, s
          assert s.get('legacy_audio_ready') is True, s
          assert s.get('audio_delivery') == 'aac-lc-48000-stereo', s
          assert str(s.get('source','')).startswith('cgtn-web-player'), s
          assert urlparse(url).hostname == 'espanol-livetx-h5.cgtn.com', url
          assert p.get('video_codec') == 'h264', p
          assert p.get('audio_codec') == 'aac', p
          assert str(p.get('audio_profile', '')).upper() == 'LC', p
          assert int(p.get('audio_rate') or 0) == 48000, p
          assert int(p.get('audio_channels') or 0) == 2, p
          headers={} if s.get('no_special_headers', False) else {
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36',
              'Referer':'https://espanol.cgtn.com/en-directo',
              'Accept':'application/vnd.apple.mpegurl,application/x-mpegURL,*/*',
          }
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=12) as r:
              body=r.read(1024*1024).decode('utf-8','replace')
          assert body.lstrip().startswith('#EXTM3U'), body[:80]
          print('portable CGTN:', p.get('width'), 'x', p.get('height'), p.get('fps'), 'fps', p.get('video_profile'), '+', p.get('audio_profile'), p.get('audio_rate'), 'Hz', p.get('audio_channels'), 'ch')
          PY
