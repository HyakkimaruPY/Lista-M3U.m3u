name: Renovar CGTN Español

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_cgtn_es.py'
      - '.github/workflows/refresh-cgtn-es.yml'

permissions:
  contents: write

concurrency:
  group: cgtn-es-runtime
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnosticar player oficial CGTN Español
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://espanol.cgtn.com/en-directo'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          curl --fail --location --compressed --user-agent "$UA" "$PAGE" -o /tmp/cgtn-page.html
          echo "HTML bytes: $(wc -c </tmp/cgtn-page.html)"
          python3 - <<'PY'
          import html, re
          from pathlib import Path
          raw = html.unescape(Path('/tmp/cgtn-page.html').read_text('utf-8', errors='replace')).replace('\\/', '/')
          exact = list(dict.fromkeys(re.findall(r'https://espanol-livetx-h5\.cgtn\.com/[^"\'<>\\ ]+\.m3u8(?:\?[^"\'<>\\ ]+)?', raw)))
          print('HTML livetx-h5 candidates:', len(exact))
          for u in exact[:10]: print('HTML-LIVE', u)
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', raw, re.I)
          print('script src count:', len(scripts))
          for s in scripts[:20]: print('SCRIPT', s)
          PY
          if command -v google-chrome >/dev/null 2>&1; then CHROME=google-chrome;
          elif command -v chromium >/dev/null 2>&1; then CHROME=chromium;
          else CHROME=''; fi
          if [[ -n "$CHROME" ]]; then
            rm -f /tmp/cgtn-netlog.json /tmp/cgtn-dom.html
            timeout 40s "$CHROME" --headless --disable-gpu --no-sandbox --disable-dev-shm-usage \
              --autoplay-policy=no-user-gesture-required --virtual-time-budget=15000 \
              --log-net-log=/tmp/cgtn-netlog.json --net-log-capture-mode=IncludeSensitive \
              --dump-dom "$PAGE" >/tmp/cgtn-dom.html 2>/tmp/cgtn-chrome.err || true
            echo "DOM bytes: $(wc -c </tmp/cgtn-dom.html 2>/dev/null || echo 0)"
            echo "NETLOG bytes: $(wc -c </tmp/cgtn-netlog.json 2>/dev/null || echo 0)"
            python3 - <<'PY'
          import json, re
          from pathlib import Path
          p=Path('/tmp/cgtn-netlog.json')
          raw=p.read_text('utf-8', errors='replace') if p.exists() else ''
          urls=[]
          for u in re.findall(r'https://espanol-livetx-h5\.cgtn\.com/[^"\\ ]+', raw):
              u=u.replace('\\u0026','&').replace('\\/','/')
              if u not in urls: urls.append(u)
          print('NET livetx-h5 candidates:', len(urls))
          for u in urls[:20]: print('NET-LIVE', u)
          for key in ('wsSecret','wsTime','LSveOGBaBw41Ea7ukkVAUdKQ'):
              print(key, 'present=', key in raw)
          PY
          else
            echo 'Chrome headless não disponível no runner'
          fi

      - name: Resolver stream oficial e atualizar referências
        run: |
          python3 scripts/refresh_cgtn_es.py \
            --output /tmp/cgtn-es.m3u8 \
            --state /tmp/cgtn-es.json \
            --patch-playlists \
            --timeout 12
          echo '--- runtime state ---'
          cat /tmp/cgtn-es.json
          echo '--- bridge manifest ---'
          sed -E 's/(cKey|vkey|guid|flowid)=[^& ]+/\1=<redacted>/g' /tmp/cgtn-es.m3u8

      - name: Gravar URL estável nas playlists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cn.m3u srhell02iptv.m3u
          if ! git diff --cached --quiet; then
            git commit -m 'Usa bridge renovável para CGTN Español [skip ci]'
            git push origin HEAD:main
          fi

      - name: Publicar bridge em branch runtime
        run: |
          git checkout --orphan cgtn-runtime-build
          git rm -rf .
          cp /tmp/cgtn-es.m3u8 ./cgtn-es.m3u8
          cp /tmp/cgtn-es.json ./cgtn-es.json
          cat > README.md <<'EOF'
          # CGTN Español runtime

          Branch gerada automaticamente. `cgtn-es.m3u8` aponta para o manifesto
          oficial atual da CGTN Español obtido pela API pública Yangshipin/CCTV.
          A branch é substituída a cada renovação; não edite manualmente.
          EOF
          git add cgtn-es.m3u8 cgtn-es.json README.md
          git commit -m "Renova CGTN Español $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push --force origin HEAD:cgtn-runtime

      - name: Validar URL pública estável
        run: |
          sleep 3
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent qqlive \
            --referer https://live.cctv.cn/ \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/cgtn-runtime/cgtn-es.m3u8" \
            | grep -q '^#EXTM3U'
