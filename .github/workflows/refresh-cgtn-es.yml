name: Renovar CGTN Español

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_cgtn_es_portable.py'
      - 'scripts/probe_cgtn_same_cdn.py'
      - 'scripts/refresh_cgtn_es_tv.py'
      - 'scripts/refresh_cgtn_es_web.py'
      - 'scripts/refresh_cgtn_es.py'
      - '.github/workflows/refresh-cgtn-es.yml'

permissions:
  contents: write

concurrency:
  group: cgtn-es-runtime
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver representação TV-safe do CGTN Español
        run: |
          python3 scripts/refresh_cgtn_es_portable.py \
            --output /tmp/cgtn-es.m3u8 \
            --state /tmp/cgtn-es.json \
            --patch-playlists \
            --timeout 12
          echo '--- runtime state ---'
          cat /tmp/cgtn-es.json
          echo '--- bridge manifest ---'
          sed -E 's/(wsSecret|cKey|vkey|guid|flowid|accountinfo)=[^& ]+/\1=<redacted>/g' /tmp/cgtn-es.m3u8

      - name: Validar contrato legado antes da publicação
        run: |
          python3 - <<'PY'
          import json
          s = json.load(open('/tmp/cgtn-es.json', encoding='utf-8'))
          p = s.get('selected', {})
          assert s.get('delivery_policy') == 'legacy-tv-safe', s
          assert s.get('legacy_audio_ready') is True, s
          assert s.get('legacy_video_ready') is True, s
          assert s.get('audio_delivery') == 'aac-lc-48000-stereo', s
          assert s.get('video_delivery') == 'h264-max720p', s
          assert s.get('source_family') in {
              'cgtn-direct-tv-safe',
              'cgtn-carrier-tv-safe',
              'cgtn-web-player',
          }, s
          assert p.get('video_codec') == 'h264', p
          assert 0 < int(p.get('height') or 0) <= 720, p
          assert float(p.get('fps') or 0) <= 60.5, p
          assert p.get('audio_codec') == 'aac', p
          assert str(p.get('audio_profile', '')).upper() == 'LC', p
          assert int(p.get('audio_rate') or 0) == 48000, p
          assert int(p.get('audio_channels') or 0) == 2, p
          assert str(s.get('selected_host') or '').strip(), s
          print('CGTN legacy contract OK:',
                s.get('source'), s.get('source_family'),
                p.get('width'), 'x', p.get('height'),
                p.get('fps'), 'fps,',
                'H.264 + AAC-LC 48 kHz stereo,',
                'bitrate=', p.get('bitrate_estimate'))
          PY

      - name: Diagnosticar representação web atual
        continue-on-error: true
        run: |
          python3 scripts/probe_cgtn_same_cdn.py

      - name: Gravar URL estável nas playlists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cn.m3u srhell02iptv.m3u
          if ! git diff --cached --quiet; then
            git commit -m 'Ajusta bridge TV-safe da CGTN Español [skip ci]'
            git push origin HEAD:main
          fi

      - name: Publicar bridge em branch runtime
        run: |
          git checkout --orphan cgtn-runtime-build
          git rm -rf .
          cp /tmp/cgtn-es.m3u8 ./cgtn-es.m3u8
          cp /tmp/cgtn-es.json ./cgtn-es.json
          cat > README.md <<'EOF'
          # CGTN Español runtime

          Branch gerada automaticamente para o player legado Philco.
          O endpoint público permanece estável; o workflow escolhe uma fonte do
          mesmo CGTN Español somente depois de sondar o MPEG-TS real.

          Contrato físico: H.264, no máximo 720p, AAC-LC 48 kHz estéreo.
          A fonte web 1080p não é promovida porque a reprodução física mostrou
          falha de decoder mesmo após o segmento TS ser baixado com sucesso.
          Mirrors CCTV/Yangshipin/China Mobile só entram se passarem o mesmo gate.
          EOF
          git add cgtn-es.m3u8 cgtn-es.json README.md
          git commit -m "Renova CGTN Español TV-safe $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push --force origin HEAD:cgtn-runtime

      - name: Validar bridge público
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          STABLE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/cgtn-runtime/cgtn-es.m3u8"
          curl --fail --location --retry 3 --retry-delay 2 "$STABLE" -o /tmp/public-cgtn.m3u8
          grep -q '^#EXTM3U' /tmp/public-cgtn.m3u8
          grep -q '^#EXT-X-STREAM-INF:' /tmp/public-cgtn.m3u8
          grep -q 'RESOLUTION=' /tmp/public-cgtn.m3u8
          grep -q 'FRAME-RATE=' /tmp/public-cgtn.m3u8
          grep -q 'CODECS=' /tmp/public-cgtn.m3u8
          grep -q 'mp4a.40.2' /tmp/public-cgtn.m3u8
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/cgtn-es.json', encoding='utf-8'))
          p=s.get('selected',{})
          assert 0 < int(p.get('height') or 0) <= 720, p
          assert s.get('legacy_audio_ready') is True, s
          assert s.get('legacy_video_ready') is True, s
          print('public CGTN TV-safe:', s.get('source'), p.get('width'), 'x', p.get('height'), p.get('fps'), 'fps')
          PY
