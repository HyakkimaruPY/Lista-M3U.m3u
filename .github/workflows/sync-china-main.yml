name: Sincronizar China com principal

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: Aplicar sincronização validada na main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: playlist-maintenance-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Sincronizar candidatos validados
        env:
          APPLY: ${{ inputs.apply_changes }}
        run: |
          ARGS=()
          if [[ "$APPLY" == "true" ]]; then ARGS+=(--apply); fi
          python3 scripts/sync_cn_to_main.py --retries 2 --timeout 25 --decode-seconds 4 "${ARGS[@]}"
      - name: Organizar e validar estrutura
        run: |
          python3 scripts/curate_main_playlist.py
          python3 -m unittest discover -s tests -v
      - name: Aplicar na main
        if: inputs.apply_changes == true
        run: |
          git add cn.m3u srhell02iptv.m3u
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sincroniza canais chineses validados [skip ci]'
          git push origin HEAD:main
