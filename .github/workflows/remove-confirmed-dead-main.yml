name: Remover streams 404 confirmados

on:
  push:
    branches:
      - fix/pr2-main-playlist-china
    paths:
      - "scripts/remove_confirmed_dead_main.py"

permissions:
  contents: write

jobs:
  remove:
    if: ${{ !contains(github.event.head_commit.message, '[dead-removed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/pr2-main-playlist-china
          fetch-depth: 0
      - name: Remover entradas confirmadas como 404
        run: python3 scripts/remove_confirmed_dead_main.py
      - name: Commitar playlist
        shell: bash
        run: |
          git add srhell02iptv.m3u
          if git diff --cached --quiet; then
            echo "Nada para remover."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove streams 404 confirmados [dead-removed]"
          git push origin HEAD:fix/pr2-main-playlist-china
