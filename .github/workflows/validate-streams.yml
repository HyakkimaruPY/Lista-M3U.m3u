name: Validar streams IPTV

on:
  workflow_dispatch:
    inputs:
      apply_removals:
        description: "Aplicar remocoes confirmadas na playlist principal"
        required: true
        default: false
        type: boolean
      limit:
        description: "Quantidade maxima por playlist (0 = todos)"
        required: true
        default: "0"
        type: string
  pull_request:
    branches:
      - main
    paths:
      - "*.m3u"
      - "scripts/validate_streams.py"
      - ".github/workflows/validate-streams.yml"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  validate:
    name: Validar ${{ matrix.playlist }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - playlist: srhell02iptv.m3u
            slug: principal
            auto_apply: true
          - playlist: cn.m3u
            slug: china
            auto_apply: false
          - playlist: testNew.m3u
            slug: test-new
            auto_apply: false
          - playlist: teste_vai.m3u
            slug: teste-vai
            auto_apply: false
          - playlist: teteNew2.m3u
            slug: teste-new-2
            auto_apply: false

    env:
      PLAYLIST: ${{ matrix.playlist }}
      REPORT_DIR: reports/stream-validation/${{ matrix.slug }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Definir modo da execucao
        id: mode
        shell: bash
        run: |
          APPLY=false
          LIMIT=0

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LIMIT="${{ inputs.limit }}"
            if [[ "${{ inputs.apply_removals }}" == "true" && "${{ matrix.auto_apply }}" == "true" ]]; then
              APPLY=true
            fi
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            APPLY=false
            LIMIT=0
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "${{ matrix.auto_apply }}" == "true" ]]; then
            APPLY=true
          fi

          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]]; then
            echo "limit precisa ser um inteiro >= 0"
            exit 2
          fi

          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "Playlist: $PLAYLIST | apply=$APPLY | limit=$LIMIT"

      - name: Validar audio e video
        id: validate
        shell: bash
        run: |
          ARGS=(
            --playlist "$PLAYLIST"
            --workers 6
            --retries 2
            --timeout 25
            --decode-seconds 4
            --limit "${{ steps.mode.outputs.limit }}"
            --report-dir "$REPORT_DIR"
          )

          if [[ "${{ steps.mode.outputs.apply }}" == "true" ]]; then
            ARGS+=(--apply)
          fi

          python3 scripts/validate_streams.py "${ARGS[@]}"

      - name: Publicar resumo no GitHub Actions
        if: always()
        shell: bash
        run: |
          if [[ -f "$REPORT_DIR/summary.md" ]]; then
            cat "$REPORT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "O validador nao produziu relatorio para $PLAYLIST." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Salvar relatorio como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stream-validation-${{ matrix.slug }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Commitar remocoes confirmadas
        if: >-
          github.ref == 'refs/heads/main' &&
          matrix.auto_apply == true &&
          steps.mode.outputs.apply == 'true' &&
          steps.validate.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$PLAYLIST"
          git commit -m "Remove streams IPTV invalidos de $PLAYLIST [skip ci]"
          git push
