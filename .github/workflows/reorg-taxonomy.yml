name: Aplicar taxonomia por conteúdo

on:
  push:
    branches:
      - taxonomy-content-groups
    paths:
      - ".github/workflows/reorg-taxonomy.yml"
      - "scripts/curate_main_playlist.py"
      - "scripts/refresh_pluto_sources.py"
      - "scripts/validate_main_non_pluto.py"
      - "tests/test_taxonomy.py"

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: taxonomy-content-groups
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Aplicar categorias-pai
        run: python3 scripts/curate_main_playlist.py --playlist srhell02iptv.m3u
      - name: Validar estrutura e regressões
        run: python3 -m unittest discover -s tests -v
      - name: Confirmar redução de categorias
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('srhell02iptv.m3u').read_text(encoding='utf-8')
          groups = sorted(set(re.findall(r'group-title="([^"]+)"', text)))
          allowed = {'Filmes', 'Séries', 'Animações', 'Variedades', 'Esportes', 'Séries VOD'}
          extra = set(groups) - allowed
          if extra:
              raise SystemExit(f'Categorias fora da taxonomia-pai: {sorted(extra)}')
          print(f'Categorias finais ({len(groups)}): {groups}')
          PY
      - name: Commitar playlist reorganizada na branch
        run: |
          git add srhell02iptv.m3u
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reorganiza canais em categorias-pai por conteúdo [skip ci]"
          git push origin HEAD:taxonomy-content-groups
