name: cgtn-autohls-parity

on:
  pull_request:
    paths:
      - 'scripts/cgtn_autohls_parity.trigger'
      - 'scripts/hls_compat.py'
      - 'tests/test_cgtn_signed_query.py'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply controlled signed-query parity patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/hls_compat.py')
          s = p.read_text()
          old = '    "policy", "key-pair-id", "expires", "exp", "hdnea", "hdnts", "jwt", "access_token", "st", "e",\n'
          new = '    "policy", "key-pair-id", "expires", "exp", "hdnea", "hdnts", "jwt", "access_token", "st", "e", "wssecret", "wstime",\n'
          if new not in s:
              if old not in s:
                  raise SystemExit('expected inherited-query allowlist line not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
          cat > tests/test_cgtn_signed_query.py <<'PY'
          from urllib.parse import parse_qs, urlsplit
          from scripts.hls_compat import resolve_with_context

          def q(url):
              return parse_qs(urlsplit(url).query)

          def test_cgtn_relative_child_inherits_signature():
              base = 'https://espanol-livetx-h5.cgtn.com/hls/live/playlist.m3u8?wsSecret=abc123&wsTime=1789310853&quality=debug'
              got = q(resolve_with_context(base, 'segment0001.ts'))
              assert got['wsSecret'] == ['abc123']
              assert got['wsTime'] == ['1789310853']
              assert 'quality' not in got

          def test_child_value_wins_and_missing_signed_key_is_inherited():
              base = 'https://espanol-livetx-h5.cgtn.com/hls/live/playlist.m3u8?wsSecret=parent&wsTime=10'
              got = q(resolve_with_context(base, 'segment.ts?wsSecret=child'))
              assert got['wsSecret'] == ['child']
              assert got['wsTime'] == ['10']

          def test_cross_host_does_not_receive_signature():
              base = 'https://espanol-livetx-h5.cgtn.com/hls/live/playlist.m3u8?wsSecret=abc123&wsTime=1789310853'
              got = q(resolve_with_context(base, 'https://cdn.example/segment.ts'))
              assert 'wsSecret' not in got
              assert 'wsTime' not in got
          PY

      - name: Test signed-query policy
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_cgtn_signed_query.py

      - name: Commit parity patch to PR branch
        run: |
          if git diff --quiet -- scripts/hls_compat.py tests/test_cgtn_signed_query.py; then
            echo 'Parity patch already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/hls_compat.py tests/test_cgtn_signed_query.py
          git commit -m 'autohls: preserve CGTN wsSecret and wsTime'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
