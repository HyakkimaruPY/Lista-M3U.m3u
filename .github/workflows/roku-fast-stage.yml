name: Teste Roku FAST H264

on:
  push:
    branches:
      - roku-fast-curation
    paths:
      - "scripts/apply_roku_fast.py"
      - ".github/workflows/roku-fast-stage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: roku-fast-curation
          fetch-depth: 0

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version | head -n 1

      - name: Aplicar bloco Roku FAST
        run: python3 scripts/apply_roku_fast.py

      - name: Salvar playlist gerada na branch
        run: |
          if git diff --quiet -- srhell02iptv.m3u; then
            echo "Playlist já estava atualizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add srhell02iptv.m3u
          git commit -m "Adicionar categorias Roku FAST à playlist principal"
          git push origin HEAD:roku-fast-curation

      - name: Validar Roku FAST e exigir vídeo H264
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          lines = Path("srhell02iptv.m3u").read_text(encoding="utf-8-sig").splitlines()
          entries = []
          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF:") or 'group-title="Roku •' not in line:
                  continue
              m = re.search(r'tvg-name="([^"]+)"', line)
              name = m.group(1) if m else line.rsplit(",", 1)[-1].strip()
              url = None
              for candidate in lines[i + 1:i + 5]:
                  candidate = candidate.strip()
                  if candidate and not candidate.startswith("#"):
                      url = candidate
                      break
              if url:
                  entries.append((name, url))

          if not entries:
              print("Nenhuma entrada Roku encontrada.")
              sys.exit(1)

          failures = []
          print(f"Testando {len(entries)} canais Roku...")
          for name, url in entries:
              result = None
              last_err = ""
              for attempt in range(1, 3):
                  try:
                      proc = subprocess.run([
                          "ffprobe", "-v", "error",
                          "-rw_timeout", "25000000",
                          "-user_agent", "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 Chrome/126 Safari/537.36",
                          "-show_entries", "stream=codec_type,codec_name",
                          "-of", "json", url,
                      ], capture_output=True, text=True, timeout=45)
                      if proc.returncode == 0:
                          result = json.loads(proc.stdout or "{}")
                          break
                      last_err = (proc.stderr or proc.stdout or f"ffprobe rc={proc.returncode}").strip()[-800:]
                  except Exception as exc:
                      last_err = str(exc)
                  if attempt < 2:
                      time.sleep(2)

              if result is None:
                  print(f"[FALHA] {name}: {last_err}")
                  failures.append((name, "sem leitura ffprobe"))
                  continue

              streams = result.get("streams", [])
              video = [s.get("codec_name") for s in streams if s.get("codec_type") == "video"]
              audio = [s.get("codec_name") for s in streams if s.get("codec_type") == "audio"]
              if not video:
                  print(f"[FALHA] {name}: sem vídeo; áudio={audio}")
                  failures.append((name, "sem vídeo"))
              elif "h264" not in video:
                  print(f"[FALHA] {name}: vídeo={video}, áudio={audio}; esperado H264")
                  failures.append((name, f"codec {video}"))
              elif not audio:
                  print(f"[FALHA] {name}: H264 presente, mas sem áudio")
                  failures.append((name, "sem áudio"))
              else:
                  print(f"[OK H264] {name}: vídeo={video}, áudio={audio}")

          print("\nResumo Roku FAST")
          print(f"total={len(entries)} falhas={len(failures)} ok={len(entries)-len(failures)}")
          if failures:
              for name, reason in failures:
                  print(f"- {name}: {reason}")
              sys.exit(1)
          PY
